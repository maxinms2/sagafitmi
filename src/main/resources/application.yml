server:
  port: ${PORT:${SERVER_PORT:8081}}
spring:
  application:
    name: backend-sagafitmi
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://sagafitmi-postgres.cc98asqskhem.us-east-1.rds.amazonaws.com:5432/postgres}
    # Read from environment variables if provided, otherwise fallback to the hardcoded values
    # Priority: DB_USERNAME / DB_PASSWORD, then SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD, then the defaults
    username: ${DB_USERNAME:sagafitmi}
    password: ${DB_PASSWORD:Peluso3000.}
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Mexico_City

